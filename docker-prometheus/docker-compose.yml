services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus_server
    networks:
      - prom_net    
    restart: always
    ports:
      - "10.33.199.21:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"              

  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    restart: always
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /home/tas02/node_exporter/textfile_collector:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/textfile_collector'
      - '--web.listen-address=10.33.199.21:9100'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"              

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: cadvisor
    devices:
      - /dev/kmsg
    pid: host
    command:
      - --disable_root_cgroup_stats=true
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "10.33.199.21:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"              
  
  grafana:
    image: grafana/grafana:13.2
    container_name: grafana_server
    networks:
      - prom_net
    restart: always
    ports:
      - "10.33.199.21:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"              

  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: alertmanager
    restart: always
    networks:
      - prom_net
    ports:
      - "10.33.199.21:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"              

  mailpit:
    image: axllent/mailpit:v1.33
    container_name: mailpit_smtp
    networks:
      - prom_net
    restart: always
    ports:
      - "10.33.199.21:1025:1025"  # Puerto SMTP solo accesible desde la LAN privada 10.33.199.16/29
      - "10.33.199.21:8025:8025"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"              

  loki:
      image: grafana/loki:3.7.10
      container_name: loki_server
      restart: always
      networks:
        - prom_net
      ports:
        - "10.33.199.21:3100:3100"
      volumes:
        - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
        - loki_data:/loki
      command: -config.file=/etc/loki/local-config.yaml
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "5"

  alloy:
      image: grafana/alloy:v1.22.0
      container_name: alloy_agent
      restart: always
      ports:
        - "10.33.199.21:12345:12345"
      volumes:
        - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - alloy_data:/var/lib/alloy/data
      command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "5"
  

networks:
  prom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  alloy_data:
    driver: local