services:
  mariadb:
    image: mariadb:10.11
    container_name: db_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "10.33.199.19:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nfs_server:
    image: erichough/nfs-server
    container_name: shared_nfs
    restart: always
    privileged: true
    environment:
      NFS_EXPORT_0: "/shared/uploads *(rw,sync,no_subtree_check,no_root_squash,fsid=0)"
    ports:
      - "10.33.199.19:2049:2049"
      - "10.33.199.19:2049:2049/udp"
    volumes:
      - ./data/uploads:/shared/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    restart: always
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--web.listen-address=10.33.199.19:9100'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: cadvisor
    devices:
      - /dev/kmsg
    pid: host
    command:
      - --disable_root_cgroup_stats=true
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "10.33.199.19:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: db_exporter
    restart: always
    command:
      - "--config.my-cnf=/.my.cnf"
    volumes:
      - ./.my.cnf:/.my.cnf
    ports:
      - "10.33.199.19:9104:9104"
    depends_on:
      - mariadb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  
  alloy:
      image: grafana/alloy:v1.22.0
      container_name: alloy_agent
      restart: always
      ports:
        - "10.33.199.19:12345:12345"
      volumes:
        - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - alloy_data:/var/lib/alloy/data
      command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "5"

volumes:
  alloy_data:
   driver: local