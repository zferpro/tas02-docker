services:
  bind9:
    image: ubuntu/bind9:9.18-24.04_edge
    container_name: dns_bind9
    restart: always
    environment:
      - BIND9_USER=bind
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./bind/named.conf:/etc/bind/named.conf:ro
      - ./bind/named.conf.options:/etc/bind/named.conf.options:ro
      - ./bind/named.conf.local:/etc/bind/named.conf.local:ro
      - ./bind/zones:/etc/bind/zones:ro

  haproxy:
    image: haproxy:2.8-alpine
    container_name: cms_haproxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/ssl/haproxy:ro

  #ads image: prom/node-exporter:v1.12.1
  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    restart: always
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--web.listen-address=10.33.199.17:9100'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    restart: always
    ports:
      - "10.33.199.17:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  
  bind_exporter:
    image: prometheuscommunity/bind-exporter:v0.8.0
    container_name: bind_exporter
    restart: always
    ports:
      - "10.33.199.17:9119:9119"
    command:
      - "--bind.stats-url=http://bind9:8053/"
