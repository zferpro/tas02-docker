volumes:
  wp_uploads:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.33.199.19,rw,nfsvers=4,async"
      device: ":/"
  alloy_data:
    driver: local

services:
  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    container_name: ${CONTAINER_NAME}
    restart: always
    dns:
      - 10.33.199.17
    ports:
      - "${CONTAINER_IP}:80:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${DOMAIN}');
        define('WP_SITEURL', 'https://${DOMAIN}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_uploads:/var/www/html/wp-content/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    restart: always
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--web.listen-address=${CONTAINER_IP}:9100'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: cadvisor
    devices:
      - /dev/kmsg
    pid: host
    command:
      - --disable_root_cgroup_stats=true
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CONTAINER_IP}:8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  apache_exporter:
    image: lusotycoon/apache-exporter:v1.1.1
    container_name: apache_exporter
    restart: always
    ports:
      - "${CONTAINER_IP}:9117:9117"
    command:
      - "--scrape_uri=http://${CONTAINER_NAME}:80/server-status?auto"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: alloy_agent
    restart: always
    environment:
      - MV_HOSTNAME=${MV_HOSTNAME}
    ports:
      - "${CONTAINER_IP}:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
