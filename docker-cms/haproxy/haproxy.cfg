global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Panel de monitoreo de HAProxy (http://10.33.195.215:8404)
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s

# Frontend HTTP: Redirección 301 a HTTPS
frontend http_in
    bind *:80
    http-request redirect scheme https code 301 unless { ssl_fc }

# Frontend HTTPS: Terminación TLS
frontend https_in
    bind *:443 ssl crt /etc/ssl/haproxy/nodosur.pem
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default_backend wp_backends

# Cluster de Backends con Round Robin y Health Check
backend wp_backends
    balance roundrobin
    option httpchk GET /
    http-check expect status 200..399
    
    # Inyecta la cabecera X-Backend-Server en la respuesta HTTP
    http-response set-header X-Backend-Server %s

    server cms01 wordpress1:80 check inter 2000ms fall 2 rise 2
    server cms02 wordpress2:80 check inter 2000ms fall 2 rise 2